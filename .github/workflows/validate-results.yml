name: Validate model results

on:
  pull_request:
    paths:
      - 'data/results/**'
      - 'data/tasks/**'
      - 'index.html'
      - 'README.md'
      - 'scripts/model-metadata.js'
      - 'scripts/model-metadata.test.js'
      - 'scripts/model-manifest.js'
      - 'scripts/model-manifest.test.js'
      - 'scripts/leaderboard-visualization.js'
      - 'scripts/leaderboard-visualization.test.js'
      - 'scripts/mobile-responsive.test.js'
      - 'scripts/site-content.test.js'
      - 'scripts/validate-results.js'
      - '.github/workflows/validate-results.yml'

jobs:
  validate-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test site behavior
        run: node --test scripts/*.test.js

      - name: Validate model result files
        run: node scripts/validate-results.js
